<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" fill="none">
  <!-- Карточка -->
  <rect width="840" height="200" rx="24" fill="#1D1A24" stroke="#2E2A38" stroke-width="1.5" />

  <!-- Заголовок секции -->
  <g transform="translate(36, 32)">
    <circle cx="10" cy="10" r="10" fill="#3B2633" />
    <circle cx="10" cy="10" r="4" fill="#F48FB1" />
    <text x="28" y="16" font-family="'Segoe UI', system-ui, sans-serif" font-size="18px" font-weight="700" fill="#EDE7F6">About me</text>
  </g>

  <!-- Полоса 1: Developer -->
  <g transform="translate(36, 68)">
