    <text x="34" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="14px" font-weight="700" fill="#EDE7F6">Developer</text>
    <text x="110" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="14px" font-weight="500" fill="#C5BBD9">— passionate about building modern web applications</text>
  </g>

  <!-- Полоса 2: Modern frontend & UI -->
  <g transform="translate(36, 110)">
    <rect width="768" height="34" rx="12" fill="#272430" />
    <circle cx="20" cy="17" r="4" fill="#CE93D8" />
