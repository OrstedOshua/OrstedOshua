    <text x="195" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="14px" font-weight="500" fill="#C5BBD9">— creating responsive, clean and expressive interfaces</text>
  </g>

  <!-- Полоса 3: Learning new technologies -->
  <g transform="translate(36, 152)">
    <rect width="768" height="34" rx="12" fill="#272430" />
    <circle cx="20" cy="17" r="4" fill="#F48FB1" />
    <text x="34" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="14px" font-weight="700" fill="#EDE7F6">Learning new technologies</text>
    <text x="228" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="14px" font-weight="500" fill="#C5BBD9">— continuously exploring tools, clean code and architecture</text>
