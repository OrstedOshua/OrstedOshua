<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" fill="none">
  <defs>
    <linearGradient id="hero_bg_F48FB1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1A26" />
      <stop offset="100%" stop-color="#191622" />
    </linearGradient>
  </defs>

  <style>
    @keyframes typing {
      from { width: 0; }
      to { width: 330px; }
    }
    @keyframes blink { 50% { opacity: 0; } }
    .hero-type {
      overflow: hidden;
      white-space: nowrap;
      display: inline-block;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 500;
      fill: #C5BBD9;
      animation: typing 3s steps(35, end) forwards;
    }
    .hero-cursor {
      animation: blink 1s infinite;
      fill: #F48FB1;
    }
  </style>

  <!-- Карточка -->
  <rect width="840" height="240" rx="24" fill="url(#hero_bg_F48FB1)" stroke="#2E2A38" stroke-width="1.5" />

  <!-- Аватар-бейдж в форме Material 3 Squircle -->
  <g transform="translate(42, 42)">
    <rect width="156" height="156" rx="42" fill="#272430" stroke="#2E2A38" stroke-width="1.5" />
    <circle cx="78" cy="78" r="42" fill="#3B2633" />
    <!-- Стильный монограммный глиф -->
    <text x="78" y="93" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="44px" font-weight="800" fill="#F48FB1">O</text>
  </g>

  <!-- Информационная часть -->
  <g transform="translate(228, 48)">
    <!-- Приветствие -->
    <text x="0" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="16px" font-weight="600" fill="#F48FB1">
      Hey there! I'm
    </text>

    <!-- Имя -->
    <text x="0" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="40px" font-weight="800" fill="#EDE7F6" letter-spacing="-0.5px">
      Orsted Oshua
    </text>

    <!-- Подзаголовок с печатным эффектом -->
    <g transform="translate(0, 102)">
      <text class="hero-type" x="0" y="0">Software developer &amp; web creator.</text>
      <rect class="hero-cursor" x="335" y="-14" width="2.5" height="18" rx="1" />
    </g>

    <!-- Пиллы: Earth и Стек -->
    <g transform="translate(0, 126)">
      <!-- Earth Chip -->
      <rect width="96" height="32" rx="16" fill="#2E2A3A" />
      <circle cx="16" cy="16" r="6" fill="#F48FB1" />
      <text x="30" y="21" font-family="'Segoe UI', system-ui, sans-serif" font-size="13px" font-weight="600" fill="#EDE7F6">Earth</text>

      <!-- Stack Chip -->
      <g transform="translate(108, 0)">
        <rect width="210" height="32" rx="16" fill="#2E2A3A" />
        <polygon points="16,11 11,16 16,21" fill="#8E869E" />
        <polygon points="22,11 27,16 22,21" fill="#8E869E" />
        <text x="34" y="21" font-family="'Segoe UI', system-ui, sans-serif" font-size="13px" font-weight="600" fill="#EDE7F6">JavaScript · TypeScript · Web</text>
      </g>
    </g>
  </g>
</svg>