<svg xmlns="http://www.w3.org/2000/svg" width="545" height="180" viewBox="0 0 545 180" fill="none">
  <defs>
    <linearGradient id="lightGrad_stats" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="541" height="176" rx="18" fill="url(#lightGrad_stats)" stroke="#DDD6FE" stroke-width="1.5" />

  <!-- Заголовок -->
  <g transform="translate(24, 26)">
    <circle cx="8" cy="8" r="6" fill="#E11D48" />
    <text x="22" y="13" font-family="'Segoe UI', system-ui, sans-serif" font-size="16px" font-weight="700" fill="#1E1B4B">GitHub Metrics</text>
  </g>

  <!-- Блок 1: Repositories -->
  <g transform="translate(24, 62)">
    <rect width="150" height="92" rx="12" fill="#F3E8FF" stroke="#C4B5FD" stroke-width="1" />
    <text x="18" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="12px" font-weight="600" fill="#6D28D9">PUBLIC REPOS</text>
    <text x="18" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="32px" font-weight="800" fill="#1E1B4B">2</text>
  </g>

  <!-- Блок 2: Contributions / Commits -->
  <g transform="translate(196, 62)">
    <rect width="165" height="92" rx="12" fill="#F3E8FF" stroke="#C4B5FD" stroke-width="1" />
    <text x="18" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="12px" font-weight="600" fill="#E11D48">CONTRIBUTIONS</text>
    <text x="18" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="32px" font-weight="800" fill="#1E1B4B">3</text>
  </g>

  <!-- Блок 3: Stars Earned -->
  <g transform="translate(383, 62)">
    <rect width="138" height="92" rx="12" fill="#F3E8FF" stroke="#C4B5FD" stroke-width="1" />
    <text x="18" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="12px" font-weight="600" fill="#6D28D9">STARS</text>
    <text x="18" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="32px" font-weight="800" fill="#1E1B4B">0</text>
  </g>
</svg>