<svg xmlns="http://www.w3.org/2000/svg" width="415" height="200" viewBox="0 0 415 200" fill="none">
  <defs>
    <linearGradient id="darkGrad_about" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110926" />
      <stop offset="100%" stop-color="#160A33" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="411" height="196" rx="18" fill="url(#darkGrad_about)" stroke="#2E1065" stroke-width="1.5" />

  <!-- Заголовок карточки -->
  <g transform="translate(24, 28)">
    <rect width="6" height="20" rx="3" fill="#FF2A85" />
    <text x="16" y="16" font-family="'Segoe UI', system-ui, sans-serif" font-size="18px" font-weight="700" fill="#F8FAFC">About Me</text>
  </g>

  <!-- Список 1: Developer -->
  <g transform="translate(24, 76)">
    <circle cx="10" cy="10" r="10" fill="#1F0F3D" stroke="#3B1875" stroke-width="1" />
    <circle cx="10" cy="10" r="4" fill="#FF2A85" />
    <text x="32" y="15" font-family="'Segoe UI', system-ui, sans-serif" font-size="14px" font-weight="600" fill="#F8FAFC">Developer</text>
    <text x="32" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="12px" fill="#6B7280">Building responsive web applications</text>
  </g>

  <!-- Список 2: Modern frontend & UI -->
  <g transform="translate(24, 128)">
    <circle cx="10" cy="10" r="10" fill="#1F0F3D" stroke="#3B1875" stroke-width="1" />
    <circle cx="10" cy="10" r="4" fill="#A855F7" />
    <text x="32" y="15" font-family="'Segoe UI', system-ui, sans-serif" font-size="14px" font-weight="600" fill="#F8FAFC">Modern Frontend &amp; UI</text>
    <text x="32" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="12px" fill="#6B7280">Clean design, fast performance &amp; UX</text>
  </g>
</svg>