    <text x="36" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="16px" font-weight="700" fill="#F8FAFC">Streak Activity</text>
  </g>

  <!-- Число стрика -->
  <g transform="translate(24, 68)">
