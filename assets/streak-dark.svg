    <text x="56" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="14px" font-weight="700" fill="#FF2A85">DAYS ACTIVE</text>
    <text x="56" y="50" font-family="'Segoe UI', system-ui, sans-serif" font-size="12px" fill="#6B7280">Continuous coding streak</text>
  </g>

  <!-- Мини-полоска прогресса -->
