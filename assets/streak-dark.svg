      <stop offset="0%" stop-color="#110926" />
      <stop offset="100%" stop-color="#160A33" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="281" height="176" rx="18" fill="url(#darkGrad_streak)" stroke="#2E1065" stroke-width="1.5" />

  <!-- Иконка огня / молнии -->
  <g transform="translate(24, 24)">
    <circle cx="14" cy="14" r="14" fill="rgba(255, 42, 133, 0.4)" />
