<svg xmlns="http://www.w3.org/2000/svg" width="415" height="200" viewBox="0 0 415 200" fill="none">
  <defs>
    <linearGradient id="lightGrad_about" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="411" height="196" rx="18" fill="url(#lightGrad_about)" stroke="#DDD6FE" stroke-width="1.5" />

  <!-- Заголовок карточки -->
  <g transform="translate(24, 28)">
    <rect width="6" height="20" rx="3" fill="#E11D48" />
    <text x="16" y="16" font-family="'Segoe UI', system-ui, sans-serif" font-size="18px" font-weight="700" fill="#1E1B4B">About Me</text>
  </g>

  <!-- Список 1: Developer -->
  <g transform="translate(24, 76)">
    <circle cx="10" cy="10" r="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1" />
    <circle cx="10" cy="10" r="4" fill="#E11D48" />
    <text x="32" y="15" font-family="'Segoe UI', system-ui, sans-serif" font-size="14px" font-weight="600" fill="#1E1B4B">Developer</text>
    <text x="32" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="12px" fill="#8B5CF6">Building responsive web applications</text>
  </g>

  <!-- Список 2: Modern frontend & UI -->
  <g transform="translate(24, 128)">
    <circle cx="10" cy="10" r="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1" />
    <circle cx="10" cy="10" r="4" fill="#7C3AED" />
    <text x="32" y="15" font-family="'Segoe UI', system-ui, sans-serif" font-size="14px" font-weight="600" fill="#1E1B4B">Modern Frontend &amp; UI</text>
    <text x="32" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="12px" fill="#8B5CF6">Clean design, fast performance &amp; UX</text>
  </g>
</svg>