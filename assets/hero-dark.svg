<svg xmlns="http://www.w3.org/2000/svg" width="850" height="230" viewBox="0 0 850 230" fill="none">
  <defs>
    <linearGradient id="darkGrad_hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B061A" />
      <stop offset="100%" stop-color="#160A33" />
    </linearGradient>
    <filter id="darkGrad_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes typing {
      from { width: 0; }
      to { width: 320px; }
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(-10px, 10px); opacity: 0.65; }
    }
    .typing-text {
      overflow: hidden;
      white-space: nowrap;
      display: inline-block;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 500;
      fill: #A78BFA;
      animation: typing 3s steps(35, end) forwards;
    }
    .cursor {
      animation: blink 1s infinite;
      fill: #FF2A85;
    }
    .orb {
      animation: pulseOrb 6s ease-in-out infinite;
      transform-origin: 750px 70px;
    }
  </style>

  <!-- Фон карточки -->
  <rect x="2" y="2" width="846" height="226" rx="20" fill="url(#darkGrad_hero)" stroke="#2E1065" stroke-width="1.5" />
  
  <!-- Декоративная неоновая акцентная линия сверху -->
  <path d="M 30 2 L 240 2" stroke="#FF2A85" stroke-width="3" stroke-linecap="round" filter="url(#darkGrad_glow)" />

  <!-- Декоративная фоновая сфера свечения -->
  <circle class="orb" cx="740" cy="80" r="90" fill="rgba(255, 42, 133, 0.4)" />
  <circle cx="740" cy="80" r="45" fill="#A855F7" opacity="0.2" />

  <!-- Чип: Earth (Земля) -->
  <g transform="translate(36, 32)">
    <rect width="100" height="28" rx="14" fill="#1F0F3D" stroke="#3B1875" stroke-width="1" />
    <circle cx="16" cy="14" r="6" fill="#FF2A85" />
    <path d="M13 14 A3 3 0 0 1 19 14 Z" fill="#FFFFFF" opacity="0.6" />
    <text x="30" y="19" font-family="'Segoe UI', system-ui, sans-serif" font-size="12px" font-weight="600" fill="#F8FAFC">Earth</text>
  </g>

  <!-- Чип: Developer -->
  <g transform="translate(146, 32)">
    <rect width="130" height="28" rx="14" fill="#1F0F3D" stroke="#3B1875" stroke-width="1" />
    <polygon points="15,9 10,14 15,19" fill="#A855F7" />
    <polygon points="21,9 26,14 21,19" fill="#A855F7" />
    <text x="32" y="19" font-family="'Segoe UI', system-ui, sans-serif" font-size="12px" font-weight="600" fill="#F8FAFC">Web Creator</text>
  </g>

  <!-- Заголовок: Приветствие и Имя -->
  <text x="36" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="34px" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5px">
    Hey, I'm <tspan fill="#FF2A85">Orsted Oshua</tspan>
  </text>

  <!-- Подзаголовок с эффектом печати -->
  <g transform="translate(36, 142)">
    <text class="typing-text" x="0" y="0">Building clean web interfaces &amp; new tools</text>
    <rect class="cursor" x="325" y="-14" width="2.5" height="18" rx="1" />
  </g>

  <!-- Статусная полоса снизу -->
  <g transform="translate(36, 185)">
    <text font-family="'Segoe UI', system-ui, sans-serif" font-size="13px" font-weight="500" fill="#6B7280">
      Focusing on modern frontend architectures, clean code &amp; expressive UX
    </text>
  </g>

  <!-- Декоративные геометрические крестики -->
  <g transform="translate(770, 160)" opacity="0.4">
    <path d="M -8 0 L 8 0 M 0 -8 L 0 8" stroke="#A78BFA" stroke-width="1.5" />
    <path d="M 28 0 L 44 0 M 36 -8 L 36 8" stroke="#FF2A85" stroke-width="1.5" />
  </g>
</svg>