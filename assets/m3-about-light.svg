    <circle cx="20" cy="17" r="4" fill="#D81B60" />
    <text x="34" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="14px" font-weight="700" fill="#1D192B">Learning new technologies</text>
    <text x="228" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="14px" font-weight="500" fill="#49454F">— continuously exploring tools, clean code and architecture</text>
