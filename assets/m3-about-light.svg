    <text x="195" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="14px" font-weight="500" fill="#49454F">— creating responsive, clean and expressive interfaces</text>
  </g>

  <!-- Полоса 3: Learning new technologies -->
