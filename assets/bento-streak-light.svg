<svg xmlns="http://www.w3.org/2000/svg" width="285" height="180" viewBox="0 0 285 180" fill="none">
  <defs>
    <linearGradient id="lightGrad_streak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="281" height="176" rx="18" fill="url(#lightGrad_streak)" stroke="#DDD6FE" stroke-width="1.5" />

  <!-- Иконка огня / молнии -->
  <g transform="translate(24, 24)">
    <circle cx="14" cy="14" r="14" fill="rgba(225, 29, 72, 0.25)" />
    <path d="M 14 5 L 9 14 L 14 14 L 13 23 L 20 12 L 15 12 Z" fill="#E11D48" />
    <text x="36" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="16px" font-weight="700" fill="#1E1B4B">Streak Activity</text>
  </g>

  <!-- Число стрика -->
  <g transform="translate(24, 68)">
    <text x="0" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="48px" font-weight="800" fill="#1E1B4B">1</text>
    <text x="56" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="14px" font-weight="700" fill="#E11D48">DAYS ACTIVE</text>
    <text x="56" y="50" font-family="'Segoe UI', system-ui, sans-serif" font-size="12px" fill="#8B5CF6">Continuous coding streak</text>
  </g>

  <!-- Мини-полоска прогресса -->
  <g transform="translate(24, 142)">
    <rect width="237" height="6" rx="3" fill="#F5F3FF" />
    <rect width="80" height="6" rx="3" fill="#E11D48" />
  </g>
</svg>