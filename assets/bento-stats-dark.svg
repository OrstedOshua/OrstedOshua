<svg xmlns="http://www.w3.org/2000/svg" width="545" height="180" viewBox="0 0 545 180" fill="none">
  <defs>
    <linearGradient id="darkGrad_stats" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110926" />
      <stop offset="100%" stop-color="#160A33" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="541" height="176" rx="18" fill="url(#darkGrad_stats)" stroke="#2E1065" stroke-width="1.5" />

  <!-- Заголовок -->
  <g transform="translate(24, 26)">
    <circle cx="8" cy="8" r="6" fill="#FF2A85" />
    <text x="22" y="13" font-family="'Segoe UI', system-ui, sans-serif" font-size="16px" font-weight="700" fill="#F8FAFC">GitHub Metrics</text>
  </g>

  <!-- Блок 1: Repositories -->
  <g transform="translate(24, 62)">
    <rect width="150" height="92" rx="12" fill="#1A0C38" stroke="#3B1875" stroke-width="1" />
    <text x="18" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="12px" font-weight="600" fill="#A78BFA">PUBLIC REPOS</text>
    <text x="18" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="32px" font-weight="800" fill="#F8FAFC">2</text>
  </g>

  <!-- Блок 2: Contributions / Commits -->
  <g transform="translate(196, 62)">
    <rect width="165" height="92" rx="12" fill="#1A0C38" stroke="#3B1875" stroke-width="1" />
    <text x="18" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="12px" font-weight="600" fill="#FF2A85">CONTRIBUTIONS</text>
    <text x="18" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="32px" font-weight="800" fill="#F8FAFC">4</text>
  </g>

  <!-- Блок 3: Stars Earned -->
  <g transform="translate(383, 62)">
    <rect width="138" height="92" rx="12" fill="#1A0C38" stroke="#3B1875" stroke-width="1" />
    <text x="18" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="12px" font-weight="600" fill="#A78BFA">STARS</text>
    <text x="18" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="32px" font-weight="800" fill="#F8FAFC">0</text>
  </g>
</svg>